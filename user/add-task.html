```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Task | TaskFlow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: radial-gradient( circle at 90% 10%, rgba(139, 92, 246, 0.12), transparent 28%), linear-gradient( 135deg, #f8faff, #eef2ff);
            color: #172033;
        }
        /* =========================
           HEADER
        ========================= */
        
        .topbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #e5e7eb;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #172033;
            font-size: 23px;
            font-weight: 800;
        }
        
        .brand-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: linear-gradient( 135deg, #6366f1, #8b5cf6);
            color: white;
        }
        
        .brand span {
            color: #6366f1;
        }
        
        .back-dashboard {
            color: #6366f1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 9px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }
        
        .back-dashboard:hover {
            background: #eef2ff;
        }
        /* =========================
           PAGE
        ========================= */
        
        .page {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
        }
        
        .form-card {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(30, 41, 59, 0.12);
        }
        /* =========================
           HEADING
        ========================= */
        
        .form-heading {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-icon {
            width: 55px;
            height: 55px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background: #eef2ff;
            color: #6366f1;
            font-size: 25px;
            font-weight: bold;
        }
        
        .form-heading h1 {
            color: #111827;
            font-size: 30px;
            margin-bottom: 8px;
        }
        
        .form-heading p {
            color: #64748b;
            font-size: 14px;
        }
        /* =========================
           FORM
        ========================= */
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        
        .form-group {
            margin-bottom: 5px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            display: block;
            color: #374151;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            outline: none;
            background: #f8fafc;
            color: #1f2937;
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            background: white;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
        }
        /* =========================
           BUTTONS
        ========================= */
        
        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
        }
        
        .cancel-btn {
            padding: 12px 20px;
            border-radius: 9px;
            border: 1px solid #e2e8f0;
            background: white;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
        }
        
        .cancel-btn:hover {
            background: #f8fafc;
            color: #374151;
        }
        
        .save-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 9px;
            background: linear-gradient( 135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(99, 102, 241, 0.23);
            transition: 0.3s;
        }
        
        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.3);
        }
        /* =========================
           RESPONSIVE
        ========================= */
        
        @media (max-width: 650px) {
            .topbar {
                padding: 0 20px;
            }
            .form-card {
                padding: 30px 22px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: auto;
            }
            .buttons {
                flex-direction: column;
            }
            .cancel-btn,
            .save-btn {
                width: 100%;
                text-align: center;
            }
            .form-heading h1 {
                font-size: 26px;
            }
        }
    </style>

</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="topbar">

        <a href="user-dashboard.html" class="brand">

            <div class="brand-icon">
                ✓
            </div>

            Task<span>Flow</span>

        </a>


        <a href="user-dashboard.html" class="back-dashboard">

            ← Dashboard

        </a>

    </header>


    <!-- =========================
         FORM PAGE
    ========================= -->

    <main class="page">

        <section class="form-card">

            <div class="form-heading">

                <div class="form-icon">
                    +
                </div>

                <h1>
                    Create New Task
                </h1>

                <p>
                    Add a task and keep your work organized.
                </p>

            </div>


            <form onsubmit="addTask(event)">

                <div class="form-grid">

                    <!-- Task Title -->

                    <div class="form-group full-width">

                        <label for="title">
                            Task Title
                        </label>

                        <input type="text" id="title" placeholder="Enter task title" required>

                    </div>


                    <!-- Description -->

                    <div class="form-group full-width">

                        <label for="description">
                            Description
                        </label>

                        <textarea id="description" placeholder="Describe your task..."></textarea>

                    </div>


                    <!-- Project -->

                    <div class="form-group">

                        <label for="project">
                            Project / Category
                        </label>

                        <input type="text" id="project" placeholder="Example: College Project" required>

                    </div>


                    <!-- Deadline -->

                    <div class="form-group">

                        <label for="deadline">
                            Deadline
                        </label>

                        <input type="date" id="deadline" required>

                    </div>


                    <!-- Priority -->

                    <div class="form-group">

                        <label for="priority">
                            Priority
                        </label>

                        <select id="priority" required>

                            <option value="">
                                Select Priority
                            </option>

                            <option value="High">
                                High
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Low">
                                Low
                            </option>

                        </select>

                    </div>


                    <!-- Status -->

                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select id="status">

                            <option value="pending">
                                Pending
                            </option>

                            <option value="completed">
                                Completed
                            </option>

                        </select>

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <a href="user-dashboard.html" class="cancel-btn">

                        Cancel

                    </a>


                    <button type="submit" class="save-btn">

                        + Create Task

                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- AUTH -->

    <script src="../js/auth.js"></script>

    <!-- USER FUNCTIONS -->

    <script src="../js/user.js"></script>

</body>

</html>
